<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Ponta Negra - 15 Anos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Importação do SDK do Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
    <style>
        :root {
            --blue-bg: #14305c;
            --text-light: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            background-color: #0b1a30;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--blue-bg);
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            padding: 30px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h2 { margin-bottom: 20px; }

        .form-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            color: #111827;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #ffffff;
            color: var(--blue-bg);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover { background-color: #e5e7eb; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        .lista-container { text-align: left; }
        .lista-container h4 {
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        ul { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }

        li {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info { display: flex; flex-direction: column; }
        .item-nome { font-size: 0.75rem; color: rgba(255, 255, 255, 0.7); text-transform: uppercase; }
        .item-comida { font-size: 1rem; font-weight: 700; color: #ffffff; }

        .delete-btn {
            background: #ef4444;
            color: white;
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        .loading-text { text-align: center; color: rgba(255, 255, 255, 0.7); padding: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Festa Americana - Ponta Negra</h2>

    <div class="form-section">
        <input type="text" id="nomeInput" placeholder="Seu Nome" required>
        <input type="text" id="itemInput" placeholder="O que vai trazer?" required>
        <button id="btnAdicionar" onclick="adicionarItem()">Confirmar na Lista</button>
    </div>

    <div class="lista-container">
        <h4>ITENS CONFIRMADOS</h4>
        <ul id="listaItens">
            <div class="loading-text">Conectando ao Appwrite...</div>
        </ul>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DO APPWRITE
    // ==========================================
    const { Client, Databases, ID } = Appwrite;

    const client = new Client()
        .setEndpoint('https://cloud.appwrite.io/v1') // Substitua se usar self-hosted
        .setProject('6a8cbe240030f26acccc');          // Insira seu Project ID

    const databases = new Databases(client);

    const DATABASE_ID = '6a8cbe240030f26acccc';
    const COLLECTION_ID = 'itens_festa';

    async function carregarLista() {
        const listaEl = document.getElementById('listaItens');
        
        try {
            const response = await databases.listDocuments(
                DATABASE_ID,
                COLLECTION_ID
            );

            listaEl.innerHTML = ''; 
            
            if(response.documents.length === 0) {
                listaEl.innerHTML = '<div class="loading-text">Nenhum item na lista ainda.</div>';
                return;
            }

            response.documents.forEach(doc => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-nome">${doc.nome}</span>
                        <span class="item-comida">${doc.item}</span>
                    </div>
                    <button class="delete-btn" onclick="removerItem('${doc.$id}')">×</button>
                `;
                listaEl.appendChild(li);
            });
        } catch (error) {
            console.error(error);
            listaEl.innerHTML = '<div class="loading-text" style="color: #ef4444;">Erro ao carregar dados.</div>';
        }
    }

    async function adicionarItem() {
        const nome = document.getElementById('nomeInput').value.trim();
        const item = document.getElementById('itemInput').value.trim();
        const btn = document.getElementById('btnAdicionar');

        if (!nome || !item) {
            alert('Preencha todos os campos.');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'SALVANDO...';

        try {
            await databases.createDocument(
                DATABASE_ID,
                COLLECTION_ID,
                ID.unique(),
                { nome, item }
            );

            document.getElementById('nomeInput').value = '';
            document.getElementById('itemInput').value = '';
            carregarLista();
        } catch (error) {
            alert('Erro ao salvar.');
            console.error(error);
        }

        btn.disabled = false;
        btn.innerText = 'Confirmar na Lista';
    }

    async function removerItem(documentId) {
        if (!confirm('Deseja remover este item?')) return;

        try {
            await databases.deleteDocument(
                DATABASE_ID,
                COLLECTION_ID,
                documentId
            );
            carregarLista();
        } catch (error) {
            alert('Erro ao excluir.');
            console.error(error);
        }
    }

    window.onload = carregarLista;
</script>

</body>
</html>
